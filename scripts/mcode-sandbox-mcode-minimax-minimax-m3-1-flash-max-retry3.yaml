logLevel: info
tui:
  statusLine:
  - current-dir
  - session-title
  - git-branch
  - review-link
  - plan-mode
  - approval-mode
  - model-with-reasoning
  - context-window
  - subagent
  - token-quota
  - context-remaining
  - model
  - cache-read-ratio
  - context-meter
  - custom-command
permissionMode: bypassPermissions
defaultModelContextWindow: 1000000
defaultModelVariant: thinking
defaultModelThinking:
  effort: max
defaultModel: custom_provider:vercel-gateway-free/minimax/minimax-m3.1-flash
custom_provider:
  vercel-gateway-free:
    name: Vercel AI Gateway - FREE
    kind: custom
    enabled: true
    api: openai-completions
    options:
      apiKey: benchkit-sandbox
      baseURL: http://inference:8080/v1
      authMode: api-key
    models:
      minimax/minimax-m3.1-flash:
        name: MiniMax M3.1 Flash (Free)
        reasoning: true
        tool_call: true
        temperature: true
        attachment: true
        limit:
          context: 1000000
          output: 65536
        cost:
          input: 0.15
          output: 0.6
          cache_read: 0.015
        modalities:
          input:
          - text
          - image
          - video
          output:
          - text
        thinking:
          effortOptions:
          - default
          - low
          - medium
          - high
          - xhigh
          - max
          defaultEffort: default
